# comradar 설정.
# 커뮤니티를 추가하는 일은 이 파일을 고치는 일이지 코드를 고치는 일이 아니다.
# 새 커뮤니티를 켜기 전에 반드시 `comradar doctor`로 연결을 확인할 것.

run:
  # 관측 구간. 보고 주기와 맞춰 두면 각 보고서가 "지난 보고 이후 새로 들어온 것"을
  # 정확히 다룬다. 더 긴 추세를 보고 싶으면 window만 늘리면 된다(예: 12).
  window_hours: 4
  # 수집은 run을 호출할 때마다(=매시간) 일어나고, 보고서는 이 주기로만 나온다.
  report_interval_hours: 4
  max_posts_per_community: 40
  min_engagement: 0          # 추천 + 2*댓글 이 값 미만이면 버린다
  max_pain_points_per_community: 12
  max_themes: 8
  max_new_ideas: 3
  timezone: Asia/Seoul
  output_dir: reports
  state_db: .comradar/state.db

models:
  # 기본은 네 역할 모두 claude-opus-5.
  # 수집 에이전트는 호출 수가 가장 많은 자리라 비용을 줄이고 싶다면 여기부터
  # effort를 낮추고, 그래도 부족하면 model을 바꾼다. 품질 저하는 보고서에
  # 그대로 드러나므로 바꾼 뒤 며칠은 결과를 비교해 볼 것.
  collector:
    model: claude-opus-5
    effort: medium
    max_tokens: 16000
  synthesizer:
    model: claude-opus-5
    effort: high
    max_tokens: 16000
  ideation:
    model: claude-opus-5
    effort: high
    max_tokens: 16000
  reporter:
    model: claude-opus-5
    effort: high
    max_tokens: 8000

# 사업화 에이전트가 대조할 기존 아이디어 목록.
# Notion 페이지의 첫 번째 표(종합 비교)를 읽는다.
# 준비: notion.so/my-integrations 에서 내부 통합을 만들고 토큰을 NOTION_TOKEN에
# 넣은 뒤, 해당 페이지의 [...] → 연결 메뉴에서 그 통합을 연결한다.
# 토큰이 없거나 요청이 실패하면 snapshot_path의 로컬 사본으로 대신한다.
portfolio:
  enabled: true
  source: notion              # notion | file
  token_env: NOTION_TOKEN
  page_id: "2ae959f514e4806b8accf715136b5e04"   # <사업화 아이디어>
  table_index: 0              # 페이지 최상위 표 중 몇 번째인지 (0 = 종합 비교)
  snapshot_path: config/ideas.yaml

http:
  # 실제로 연락 가능한 식별자로 바꿀 것. Reddit을 포함한 여러 사이트가
  # 정체를 밝히지 않는 클라이언트를 차단한다.
  user_agent: "comradar/0.1 (+https://github.com/bksgyp/potential-octo-giggle)"
  timeout_seconds: 20
  request_delay_seconds: 1.0
  max_concurrent_fetches: 4

delivery:
  markdown: true
  html: true
  stdout: true
  # 이 이름의 환경변수에 웹훅 URL이 있으면 슬랙으로도 보낸다. 없으면 조용히 넘어간다.
  slack_webhook_env: SLACK_WEBHOOK_URL

# ---------------------------------------------------------------------------
# 국내 3 : 해외 2.
#
# 국내 대형 커뮤니티는 대부분 공식 RSS가 없다. 확인한 바로는 클리앙,
# 디시인사이드, 오늘의유머는 공식 피드를 제공하지 않고, 뽐뿌는 뽐뿌게시판·쿠폰·
# 이벤트 같은 특가 게시판에만 제공한다. 그래서 여기서는 추측한 주소를 쓰지 않고,
# 사이트가 문서로 밝힌 경로만 기본값으로 둔다.
#
#   루리웹  — 공식 RSS 안내가 있고 주소 형식이 공개되어 있다.
#             https://bbs.ruliweb.com/{탑메뉴}/board/{게시판번호}/rss
#   네이버  — 검색 API로 카페글과 지식iN을 읽는다. 국내 최대 UGC이고,
#             지식iN은 사람들이 생활에서 막혔을 때 찾아오는 곳이다.
#
# 다른 사이트를 붙이고 싶으면 주소를 추측하지 말고 물어보면 된다.
#   comradar discover https://그사이트/게시판주소 --name "커뮤니티 이름"
# ---------------------------------------------------------------------------
communities:
  # --- 국내 3 ---
  # options.url은 후보 목록을 받는다. 첫 번째로 항목이 파싱되는 주소를 쓴다.
  # 사이트가 개편돼 한쪽이 죽어도 다음 주소로 넘어간다.
  - name: 루리웹 유머 게시판
    source: rss
    locale: ko
    options:
      url:
        - https://bbs.ruliweb.com/community/board/300143/rss
        - https://m.ruliweb.com/community/board/300143/rss
    max_posts: 40

  # 네이버 검색 API. https://developers.naver.com 에서 애플리케이션을 등록하고
  # NAVER_CLIENT_ID / NAVER_CLIENT_SECRET 환경변수에 넣으면 된다.
  # 키가 없으면 이 두 소스는 그 회차에 실패하고 보고서 각주에 그대로 남는다.
  # 키를 만들지 않겠다면 아래 예비 소스의 루리웹 질문 게시판과 뽐뿌를 켜면 된다.
  #
  # 검색 API라서 씨앗 질의가 필요하다. 질의가 곧 표본이라는 뜻이고, 질의를 바꾸면
  # 보이는 불편도 바뀐다. 이 편향은 숨기지 말고 알고 쓸 것.
  - name: 네이버 카페 통합검색
    source: naver
    locale: ko
    options:
      service: cafearticle
      sort: date
      queries:
        - 너무 불편해요
        - 방법 없을까요
        - 매번 이래야 하나요
        - 이거 저만 그런가요
    max_posts: 40

  - name: 네이버 지식iN
    source: naver
    locale: ko
    options:
      service: kin
      sort: date
      queries:
        - 어떻게 해야 하나요
        - 방법이 없을까요
        - 매번 이렇게 해야 하나요
    max_posts: 30

  # --- 해외 2 ---
  # Reddit은 세계 최상위 트래픽 커뮤니티다. 두 서브레딧 모두 생활 마찰이 주제다.
  # r/mildlyinfuriating은 사소하지만 반복되는 불편, r/LifeProTips는 사람들이
  # 실제로 쓰고 있는 우회책이 모인다. 우회책이 많다는 것은 제품이 없다는 뜻이다.
  - name: r/mildlyinfuriating
    source: reddit
    locale: en
    options:
      subreddit: mildlyinfuriating
      listing: new
    max_posts: 40

  - name: r/LifeProTips
    source: reddit
    locale: en
    options:
      subreddit: LifeProTips
      listing: new
    max_posts: 30

  # ---------------------------------------------------------------------------
  # 예비 소스. 위 중 하나가 막히거나 네이버 키를 만들지 않을 때 자리를 메운다.
  # 루리웹 질문 게시판과 뽐뿌는 공식 문서로 확인된 주소이므로 바로 켜도 된다.
  # ---------------------------------------------------------------------------
  - name: 루리웹 질문 게시판
    source: rss
    enabled: false
    locale: ko
    options:
      url:
        - https://bbs.ruliweb.com/community/board/300142/rss
        - https://m.ruliweb.com/community/board/300142/rss

  # 뽐뿌는 특가 게시판에만 RSS를 제공한다(자유게시판·유머게시판은 없음).
  # 생활 불편보다는 소비 마찰이 잡힌다는 점을 감안할 것.
  - name: 뽐뿌 뽐뿌게시판
    source: rss
    enabled: false
    locale: ko
    options:
      url:
        - http://www.ppomppu.co.kr/rss.php?id=ppomppu

  - name: Hacker News
    source: hackernews
    enabled: false
    locale: en
    options:
      tags: story

  - name: Ask HN
    source: hackernews
    enabled: false
    locale: en
    options:
      tags: ask_hn

  - name: Lemmy World
    source: lemmy
    enabled: false
    locale: en
    options:
      instance: https://lemmy.world
      sort: New
      type: All

  # Discourse를 쓰는 포럼이면 base_url만 바꿔 끼우면 된다.
  - name: Discourse Meta
    source: discourse
    enabled: false
    locale: en
    options:
      base_url: https://meta.discourse.org

  # 전용 어댑터가 없는 JSON API는 이 형태로 붙인다.
  - name: 예시 JSON API
    source: json
    enabled: false
    locale: ko
    options:
      url: https://example.com/api/posts
      items_path: data.items       # 배열이 있는 위치. 최상위면 비워 둔다.
      params:
        limit: 40
      fields:                       # 왼쪽이 comradar 필드, 오른쪽이 응답 키 경로
        id: id
        title: subject
        body: content
        url: permalink
        author: writer.nickname
        score: like_count
        comments: comment_count
        created_at: created_at
